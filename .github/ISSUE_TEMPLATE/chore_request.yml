name: 维护任务
description: 提交文档、依赖、测试或仓库维护任务。
title: "[Chore] "
body:
  - type: textarea
    id: objective
    attributes:
      label: 目标与范围
      description: 说明要解决的问题、涉及的文件或模块。
    validations:
      required: true
  - type: textarea
    id: tasks
    attributes:
      label: 任务与验收
      description: 列出具体改动和本地验证方式。
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: 依赖与相关记录
      description: 可附需求编号、关联 Issue、兼容性或发布注意事项。
